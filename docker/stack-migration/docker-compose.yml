services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coolify
      POSTGRES_USER: coolify
      POSTGRES_PASSWORD: ${DB_PASSWORD:-coolify-dev-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coolify"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  controlplane:
    build:
      context: ../..
      dockerfile: docker/stack-migration/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://coolify:${DB_PASSWORD:-coolify-dev-secret}@postgres:5432/coolify?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      REDIS_PREFIX: "coolify:go:v1:"
      APP_KEY: ${APP_KEY:-base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      APP_URL: ${APP_URL:-http://localhost:8000}
      ROOT_USER_EMAIL: ${ROOT_USER_EMAIL:-admin@coolify.local}
      ROOT_USER_PASSWORD: ${ROOT_USER_PASSWORD:-CoolifyAdmin123!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - coolifydata:/data/coolify

  worker:
    build:
      context: ../..
      dockerfile: docker/stack-migration/Dockerfile
    entrypoint: ["/usr/local/bin/coolify-worker"]
    # The worker has no HTTP listener; do not inherit the control-plane probe.
    healthcheck:
      disable: true
    command: ["-executor-bin", "/usr/local/bin/coolify-executor", "-server-concurrency", "4"]
    environment:
      DATABASE_URL: postgres://coolify:${DB_PASSWORD:-coolify-dev-secret}@postgres:5432/coolify?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      REDIS_PREFIX: "coolify:go:v1:"
      APP_KEY: ${APP_KEY:-base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - coolifydata:/data/coolify

volumes:
  pgdata:
  redisdata:
  coolifydata:
