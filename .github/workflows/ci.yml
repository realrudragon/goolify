name: CI

on:
  push:
    branches: [main, goolify]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go backend (PostgreSQL 16 + Redis 7)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coolify
          POSTGRES_PASSWORD: coolify_test_pw
          POSTGRES_DB: coolify_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U coolify -d coolify_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://coolify:coolify_test_pw@127.0.0.1:15432/coolify_test?sslmode=disable
      TEST_REDIS_URL: redis://127.0.0.1:16379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: go test
        working-directory: backend
        run: go test -count=1 -p 1 ./...

  executor:
    name: Rust executor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: executor
      - name: cargo test
        working-directory: executor
        run: cargo test --workspace

  web:
    name: Astro + Vue web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Type check and build
        working-directory: apps/web
        run: npm run check && npm run build
      - name: Contract tests
        run: node --test tests/stack-migration/inventory.test.ts tests/stack-migration/web-shell.spec.ts

  image:
    name: Standalone Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/stack-migration/Dockerfile
          push: false
          tags: goolify:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
